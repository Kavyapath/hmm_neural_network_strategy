# A smaller, guaranteed-to-succeed config for a first run against
# synthetic_data.py's output. config.yaml mirrors STEP_10_PACKAGING.md's
# reference config exactly (2 tickers, min_trades_for_threshold: 20) — on
# synthetic data that config can legitimately hit the "insufficient data"
# guardrail (correct behavior, not a bug: see README's "Try it yourself"
# section). This file trades realism for a demo that reliably produces a
# trained model, so you can see every artifact get written on a first run.
data:
  tickers: ["AAA", "BBB", "CCC"]
  benchmark: "SYN_BENCH"
  start: "2010-01-01"
  end: "2020-01-01"
  seed: 0

regime:
  n_states: 3

pullback:
  ma_window: 50
  rel_strength_window: 20
  pullback_window: 3
  prior_high_lookback: 10

trade_sim:
  atr_window: 14
  stop_atr_mult: 1.5
  target_r_mult: 2.0
  max_holding_sessions: 7
  commission_bps: 1.0
  slippage_bps: 2.0

model:
  lookback: 20
  hidden_size: 16
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  max_epochs: 20
  patience: 4
  seed: 42

walk_forward:
  min_trades_for_threshold: 10
  threshold_grid: [0.3, 0.9, 25]

portfolio:
  starting_cash: 100000.0
  risk_pct_per_trade: 0.01
  # Synthetic prices compound over 10 years of positive drift to levels
  # where a realistic $-stop is a small percentage of price, so fixed-risk
  # sizing implies large notional per trade — max_position_pct is raised
  # here (vs. config.yaml's 0.20) purely so this demo config actually
  # admits trades; it is not a recommended real-money setting.
  max_position_pct: 1.0
  max_concurrent_trades: 5
  max_aggregate_risk_pct: 0.06

ablation:
  feature_blocks: ["technical", "regime", "volatility"]
